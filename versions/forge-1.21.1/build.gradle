plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
def modProps = new Properties()
file('../../mod.properties').withInputStream { modProps.load(it) }
version = modProps.mod_version
group = 'local.modsync'
base { archivesName = 'modsync-forge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Code shared by every version, plus the Forge entry point; this folder only adds what differs in 1.21.1
sourceSets.main.java { srcDir '../../shared/src/main/java'; srcDir '../../shared/src/guigraphics/java'; srcDir '../../loader/forge/java' }
sourceSets.main.resources { srcDir '../../shared/src/main/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version
    // Forge uses official (Mojang) names at runtime since 1.20.6, so no reobf and no mixin refmap
    reobf = false
    copyIdeResources = true
    runs {
        configureEach { mods { modsync { source sourceSets.main } } }
        client { workingDirectory project.file('run-client') }
        server { workingDirectory project.file('run-server'); args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources').configure {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
}

tasks.named('jar', Jar).configure {
    manifest { attributes 'MixinConfigs': 'modsync.mixins.json', 'Implementation-Version': project.version }
}
